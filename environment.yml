name: genome-assembly
channels:
  - conda-forge
  - bioconda
channel_priority: strict
dependencies:
  - python=3.10
  - fastqc=0.12.1
  - multiqc=1.32
  - trimmomatic=0.39
  - cutadapt=5.1
  - mash=2.3
  - kat=2.4.2
  - lighter=1.1.3
  - seqtk=1.5
  - flash=1.2.11
  - spades=4.2.0
  - quast=5.3.0
  - jq
  - pip
  - pip:
      - contig-tools==0.2.3
      - qualifyr==1.4.4
      - bactinspectormax==0.1.3
# ConFindr is deliberately kept in the Linux container because its old dependency
# stack is generally not solvable natively on current macOS arm64.

